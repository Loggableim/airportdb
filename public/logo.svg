<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ca4dc"/>
      <stop offset="100%" style="stop-color:#0B1D3A"/>
    </linearGradient>
  </defs>
  
  <!-- Globe icon -->
  <g transform="translate(8, 8)">
    <circle cx="32" cy="32" r="28" fill="none" stroke="#2ca4dc" stroke-width="2.5"/>
    <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="#2ca4dc" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="32" cy="32" rx="12" ry="28" fill="none" stroke="#2ca4dc" stroke-width="1.5" opacity="0.7"/>
    <line x1="4" y1="32" x2="60" y2="32" stroke="#2ca4dc" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="4" x2="32" y2="60" stroke="#2ca4dc" stroke-width="1" opacity="0.4"/>
    
    <!-- Airplane -->
    <g transform="translate(32, 32) rotate(-30)">
      <path d="M-18,-2 L18,0 L-18,2 L-14,0 Z" fill="#2ca4dc"/>
      <path d="M-6,-10 L2,-2 L-2,-2 Z" fill="#2ca4dc" opacity="0.8"/>
      <path d="M-6,10 L2,2 L-2,2 Z" fill="#2ca4dc" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Text: World Airport -->
  <text x="85" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0B1D3A" letter-spacing="-0.5">World<tspan fill="#2ca4dc">Airport</tspan></text>
  
  <!-- Text: Database -->
  <text x="85" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#5A6B7F" letter-spacing="3">DATABASE</text>
  
  <!-- Tagline line -->
  <line x1="85" y1="64" x2="390" y2="64" stroke="#2ca4dc" stroke-width="0.5" opacity="0.3"/>
</svg>
